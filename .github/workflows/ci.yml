name: CI Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]


jobs:
  Build-Scans-K8s-Test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Run Gosec Security Scanner
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@v2.15.0
        $(go env GOPATH)/bin/gosec -severity high -fmt sarif -out gosec.sarif ./http-echo/... || true
        
    - name: Summary of Gosec SARIF results
      run: |
        echo "==== Summary of High Severity Issues ===="
        COUNT=$(jq '.runs[].results | length' gosec.sarif)
        if [ "$COUNT" -eq 0 ]; then
          echo "✅ No high-severity issues found by Gosec."
        else
          jq -r '.runs[].results[] | 
            "🚨 Rule: \(.ruleId)\n📄 File: \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)\n📌 Message: \(.message.text)\n---"' gosec.sarif
        fi

    - name: Run Nancy SCA Scanner
      run: |
        cd http-echo
        go list -json -deps ./... | docker run --rm -i sonatypecommunity/nancy:latest sleuth

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build binary
      run: |
        cd http-echo
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/linux/amd64/http-echo

    - name: Build Docker image locally
      run: |
        cd http-echo
        docker build -t http-echo:test --build-arg BIN_NAME=http-echo .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'http-echo:test'
        format: 'table'
        severity: 'HIGH,CRITICAL'

    - name: Display Trivy scan results
      run: |
        echo "=== Trivy Image Vulnerability Scan ==="
        trivy image --severity HIGH,CRITICAL http-echo:test
    
    - name: Run Trivy K8s code scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: './k8s'
        format: 'table'
        severity: 'HIGH,CRITICAL'
    
    - name: Display Trivy K8s scan results
      run: |
        echo "=== Trivy Kubernetes Manifests Scan ==="
        trivy config --severity HIGH,CRITICAL ./k8s

    - name: Create KinD cluster
      uses: helm/kind-action@v1.8.0
      with:
        config: kind_cluster.yaml
        cluster_name: test-cluster

    - name: Install NGINX Ingress Controller in KinD cluster
      run: |
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=300s

    - name: Load Docker image to KinD
      run: |
        cd http-echo
        docker build -t http-echo:test --build-arg BIN_NAME=http-echo .
        kind load docker-image http-echo:test --name test-cluster
        
    - name: Update image in manifests
      run: |
        cd k8s/base
        sed -i "s|image: http-echo:latest|image: http-echo:test|g" deployment.yaml
        sed -i "s|imagePullPolicy: IfNotPresent|imagePullPolicy: Never|g" deployment.yaml

    - name: Deploy FOO application
      run: |
        kubectl apply -k k8s/overlays/foo/
        kubectl wait --for=condition=available --timeout=300s deployment/foo-http-echo

    - name: Deploy BAR application
      run: |
        kubectl apply -k k8s/overlays/bar/
        kubectl wait --for=condition=available --timeout=300s deployment/bar-http-echo

    - name: Verify deployments
      run: |
        kubectl get pods,svc,ingress
        kubectl describe ingress
    
    - name: Debug bar-http-echo Deployment & Ingress
      run: |
        echo "🔍 Deployments:"
        kubectl get deployments -o wide

        echo "🔍 Pods:"
        kubectl get pods -o wide

        echo "🔍 Services:"
        kubectl get svc -o wide

        echo "🔍 Ingresses:"
        kubectl describe ingress bar-http-echo

        echo "🔍 Events:"
        kubectl get events --sort-by=.metadata.creationTimestamp


    - name: Test Ingress with curl
      run: |
        echo "127.0.0.1 foo.localhost bar.localhost" | sudo tee -a /etc/hosts

        echo "🔍 Curling foo.localhost..."
        curl -v http://foo.localhost

        echo "🔍 Curling bar.localhost..."
        curl -v http://bar.localhost


    - name: Install hey for load testing
      run: |
        wget -O hey https://hey-release.s3.us-east-2.amazonaws.com/hey_linux_amd64
        chmod +x hey
        sudo mv hey /usr/local/bin/

    - name: Run load tests
      id: loadtest
      run: |
        # Add hosts to /etc/hosts
        echo "127.0.0.1 foo.localhost bar.localhost" | sudo tee -a /etc/hosts
        
        # Test foo.localhost
        echo "Testing foo.localhost..." > loadtest_output.txt
        hey -n 1000 -c 50 -t 30 http://foo.localhost >> foo_output.txt 2>&1
        
        echo "\nTesting bar.localhost..." >> loadtest_output.txt
        hey -n 1000 -c 50 -t 30 http://bar.localhost >> bar_output.txt 2>&1
        
        # Output both files for reference (optional)
        echo "FOO OUTPUT:"
        cat foo_output.txt
        echo "BAR OUTPUT:"
        cat bar_output.txt
        
        # Parse results
        {
          echo "LOADTEST_RESULTS<<EOF"
          echo "===== foo.localhost ====="
          cat foo_output.txt
          echo "===== bar.localhost ====="
          cat bar_output.txt
          echo "EOF"
        } >> $GITHUB_OUTPUT
    
    # - name: "Testing the output format"
    #   run: echo "${{ steps.loadtest.outputs.LOADTEST_RESULTS }}"
    
    - name: Parse load test metrics
      id: metrics
      run: |
        # Parse foo.localhost
        AVG_RESPONSE_TIME_FOO=$(grep "Average:" foo_output.txt | awk '{print $2}' || echo "N/A")
        P90_RESPONSE_TIME_FOO=$(grep "90% in" foo_output.txt | awk '{print $3}' || echo "N/A")
        P95_RESPONSE_TIME_FOO=$(grep "95% in" foo_output.txt | awk '{print $3}' || echo "N/A")
        TOTAL_REQUESTS_FOO=$(grep "Total:" foo_output.txt | awk '{print $2}' || echo "0")
        SUCCESS_RATE_FOO=$(grep "Status code distribution:" -A 1 foo_output.txt | grep "200" | awk '{print $3}' || echo "0")

        # Parse bar.localhost
        AVG_RESPONSE_TIME_BAR=$(grep "Average:" bar_output.txt | awk '{print $2}' || echo "N/A")
        P90_RESPONSE_TIME_BAR=$(grep "90% in" bar_output.txt | awk '{print $3}' || echo "N/A")
        P95_RESPONSE_TIME_BAR=$(grep "95% in" bar_output.txt | awk '{print $3}' || echo "N/A")
        TOTAL_REQUESTS_BAR=$(grep "Total:" bar_output.txt | awk '{print $2}' || echo "0")
        SUCCESS_RATE_BAR=$(grep "Status code distribution:" -A 1 bar_output.txt | grep "200" | awk '{print $3}' || echo "0")

        # Output results
        echo "avg_response_time_foo=$AVG_RESPONSE_TIME_FOO" >> $GITHUB_OUTPUT
        echo "p90_response_time_foo=$P90_RESPONSE_TIME_FOO" >> $GITHUB_OUTPUT
        echo "p95_response_time_foo=$P95_RESPONSE_TIME_FOO" >> $GITHUB_OUTPUT
        echo "total_requests_foo=$TOTAL_REQUESTS_FOO" >> $GITHUB_OUTPUT
        echo "success_rate_foo=$SUCCESS_RATE_FOO" >> $GITHUB_OUTPUT

        echo "avg_response_time_bar=$AVG_RESPONSE_TIME_BAR" >> $GITHUB_OUTPUT
        echo "p90_response_time_bar=$P90_RESPONSE_TIME_BAR" >> $GITHUB_OUTPUT
        echo "p95_response_time_bar=$P95_RESPONSE_TIME_BAR" >> $GITHUB_OUTPUT
        echo "total_requests_bar=$TOTAL_REQUESTS_BAR" >> $GITHUB_OUTPUT
        echo "success_rate_bar=$SUCCESS_RATE_BAR" >> $GITHUB_OUTPUT

    - name: Comment PR with results
      uses: actions/github-script@v7
      with:
        script: |
          const loadtestOutput = `${{ steps.loadtest.outputs.LOADTEST_RESULTS }}`;
          
          const output = `## 🚀 CI Pipeline Results

          ### 📊 Load Test Results

          | Metric                  | foo.localhost | bar.localhost |
          |------------------------|---------------|---------------|
          | Average Response Time  | ${{ steps.metrics.outputs.avg_response_time_foo }} | ${{ steps.metrics.outputs.avg_response_time_bar }} |
          | P90 Response Time      | ${{ steps.metrics.outputs.p90_response_time_foo }} | ${{ steps.metrics.outputs.p90_response_time_bar }} |
          | P95 Response Time      | ${{ steps.metrics.outputs.p95_response_time_foo }} | ${{ steps.metrics.outputs.p95_response_time_bar }} |
          | Success Rate           | ${{ steps.metrics.outputs.success_rate_foo }} | ${{ steps.metrics.outputs.success_rate_bar }} |
          | Total Requests         | ${{ steps.metrics.outputs.total_requests_foo }} | ${{ steps.metrics.outputs.total_requests_bar }} |

          ### 🔒 Security Scans
          - ✅ SAST scan completed
          - ✅ SCA scan completed  
          - ✅ Container vulnerability scan completed
          - ✅ Kubernetes security scan completed

          ### 🐳 Docker Image
          - Image: \`http-echo:test\` (local build)

          ### ☸️ Kubernetes Deployment
          - ✅ KinD cluster created successfully
          - ✅ NGINX Ingress Controller installed
          - ✅ foo-http-echo deployed and healthy
          - ✅ bar-http-echo deployed and healthy

          <details>
          <summary>📋 Full Load Test Output</summary>

          \`\`\`
          ${loadtestOutput}
          \`\`\`
          </details>`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          });

